name: Pipeline CI

on:
  push:
    branches: [ "main" ]

jobs:
  
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Instalar Flake8
        run: pip install flake8
      - name: Executar Lint (Flake8)
        run: flake8 ./backend --count --show-source --statistics --max-line-length=120

  build-backend:
    needs: lint-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir Imagem Docker do Backend
        run: docker build -t backend-img ./backend

  test-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Instalar Dependências
        run: pip install -r backend/requirements.txt
      - name: Executar Testes Django
        working-directory: ./backend
        run: python manage.py test

  
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar Dependências
        working-directory: ./frontend
        run: npm ci
      - name: Executar Lint (ESLint)
        working-directory: ./frontend
        run: npm run lint

  build-frontend:
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar Dependências
        working-directory: ./frontend
        run: npm ci
      - name: Construir Frontend (Next.js)
        working-directory: ./frontend
        run: npm run build

  test-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar Dependências
        working-directory: ./frontend
        run: npm ci
      - name: Executar Testes
        working-directory: ./frontend
        # Caso o Next.js não tenha testes criados por defeito, isto impede o erro inicial
        run: npm test --if-present