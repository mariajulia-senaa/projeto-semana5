name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

# Evita dois deploys ao mesmo tempo, cancelando o mais antigo se um novo entrar
concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint_and_test:
    name: Lint e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Executar Lint e Testes da Semana 5
        run: |
          cd frontend
          npm install
          npm run lint
          npm run test
          
  build_and_deploy:
    name: Build e Deploy
    runs-on: ubuntu-latest
    # Define a dependência: este job só arranca se o lint_and_test brilhar e não der erros
    needs: lint_and_test 
    steps:
      - uses: actions/checkout@v4
      
      - name: Build com STATIC_EXPORT
        run: |
          cd frontend
          npm install
          STATIC_EXPORT=true npm run build
          
      - name: Firebase Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARIAJULIASENA }}
          channelId: live
          projectId: mariajuliasena
          
      - name: Teste de Fumaça (Smoke Test)
        # Bate na URL de produção para garantir que ela não está a devolver erros críticos
        run: curl --fail https://mariajuliasena.web.app
